  hypothesis: Book 최고 기록 R@20 .1672 (2026-10-28)은 raw_response 단일 view 임베딩(persona_emb_one.pkl)으로 클러스터링·prior를 만든
    실행이었다. 4-view 평균보다 단일 view가 클러스터 분리와 prior를 더 선명하게 만든다.
  prediction: 재현 시 R@10 ≈ .110, N@10 ≈ .085 (MOSAIC과 동률 수준).
  decision_rule: 재현되면 one-view를 기본 후보로 승격하고 gate=cluster와 결합. 재현 안 되면(.1606 수준) 10-28 결과는 편차로 보고 폐기.
  needs: persona_emb_one.pkl 링크 추가됨(사용자, 11-02 15:51), persona_file 노브 추가됨(11-02 16:50; 기존 one_ 클러스터 캐시 재사용, silhouette
    .1583, sizes 16614/11532).
  ledger_id: persona_mosaic-amazon_book-1102-155525
