# Experiment queue of the PERSONA-MOSAIC harness.
#   status: ready (tier A: the agent may launch) | proposed (waits for the user) | launched | done | rejected
#   tier:   A = overrides only | B = needs a code / yml-default change -> user approval, then `launch --queue qNNN --approved`
#   Every entry carries hypothesis / prediction / decision_rule BEFORE it is launched, and `contribution` names the
#   claim(s) it serves: experts-not-handcrafted | moe | weighted-gate | intent-conformity-in-personas | protocol.
#   `repeat: true` allows a config that is already in the ledger (same seed; nondeterminism floor).
#   run.py rewrites this file when it launches an entry (status -> launched, ledger_id added); the header is kept.
experiments:
- id: q001
  status: launched
  tier: A
  model: persona_mosaic
  dataset: amazon_book
  overrides: {}
  repeat: true
  label: baseline repeat (nondeterminism floor)
  contribution:
  - protocol
  hypothesis: 같은 설정, 같은 seed(2025)의 재실행 편차가 R@10/N@10에서 .002 안에 든다. 이후 모든 비교의 잡음 기준으로 쓴다.
  prediction: R@10 .106~.108, N@10 .082~.085 (기존 세 번 .1064/.1070/.1077, .0828/.0832/.0825).
  decision_rule: 편차 <= .002 → noise_floor_default 유지. 더 크면 constraints.yaml의 noise_floor_default를 관측값으로 올리고, 과거
    결론 중 그 폭 안의 것은 JOURNAL에 '차이 없음'으로 정정한다.
  ledger_id: persona_mosaic-amazon_book-1102-152858
- id: q002
  status: launched
  tier: A
  model: persona_mosaic
  dataset: amazon_book
  overrides:
    persona_file: persona_emb_one.pkl
  label: one-view persona embedding (재현)
  contribution:
