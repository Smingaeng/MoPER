  prediction: (a) N@10 .091 이상, beta 0.3~1.5에서 안정 → 내용 경로 유효. (b) .087~.091 → 내용 항은 중립. (c) beta→0 또는 붕괴 → 내용 경로
    종결.
  decision_rule: (a) → expert별 텍스트 항·beta 초기값 축으로 확장(코드 복구 후 패치 재적용 필요). (b)/(c) → text_score 계열 폐기, 코드는 복구 상태 유지.
  needs: '코드 변경(text_score_detach)은 2026-11-02 실험 후 복구(사용자 조건). 재현용 diff: harness/patches/2026-11-02-q005-text_score_detach.patch'
