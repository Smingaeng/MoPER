# Machine-checked rules of the PERSONA-MOSAIC harness (harness/run.py validate | launch).
# The prose rules live in harness/CLAUDE.md; when the two disagree, CLAUDE.md wins and this file must be fixed.

# Auto-approval (user, 2026-11-02): tier A proposals (override-only experiments inside the rules of this file) are
# created as `ready` and launched by the next tick without asking.  Tier B (code / yml-default changes) still waits
# for the user unless B is set to true here; then the agent implements, smoke-tests, records the diff in JOURNAL.md
# and launches.  Tier C never.
auto_approve: {A: true, B: false}

# Priority (user, 2026-11-03 23:50): ONE shared methodology on all three datasets (structural knobs identical; only
# hyper-parameters such as the alignment weight may differ per dataset), and G1 on all three with it.  Phase P1 = G1 on
# amazon_book, amazon_movie, yelp under `shared_structure`; P2 = G2 and G3.  A single run >= goal_margin counts (no repeats).
phases:
  - {name: P1, goals: [G1], datasets: [amazon_book, amazon_movie, yelp]}
  - {name: P2, goals: [G2, G3], datasets: [amazon_book, amazon_movie, yelp]}
phase_lock: true   # launch refuses a persona_mosaic run on a dataset outside the current phase
achieved:   # (dataset, goal) reached by one run of the shared structure; the tick records the config string here
  amazon_book:
    G1: "shared structure (mean target) + persona_align_weight=0.02: q051 +4.9% (.0766/.1165/.0755/.0891); facet target gave +8.1% but is not the shared structure"

# The shared methodology (user, 2026-11-03): these knobs must take exactly these values in every candidate run on every
# dataset.  A run that deviates is an EXPLORATION: report/goals mark it "struct!=" and it is never a goal candidate.
# To adopt a structural change, run it on all three datasets; if G1 holds (or improves) on all three, change the value
# here (and the yml defaults), which re-validates every past run automatically.
shared_structure:
  gate_mode: residual
  persona_file: persona_emb_one.pkl
  prior_composition: mean
  item_text: profile
  persona_align_target: learned
  prior_injection: modulate
  text_score: false
  clustering_k_select: silhouette
  prior_space: raw
  text_dim: 4096
  gate_cluster_scale: 1.0
  persona_align_side: both
  persona_center: true
  gate_persona_similarity: true
  text_score_detach: false
# Per-dataset hyper-parameters (free): persona_align_weight, persona_align_decay_epochs, llm_align_temperature,
# balance_loss_weight, top_k (>= 2), layer_num, reg_weight, gate_warmup_epochs, layer_modulation_scale / _lambda_init /
# _init_std, prior_hidden_size, gate_hidden_size.  (user, 2026-11-04: top_k only needs to be >= 2; when an adopted
# structural change underperforms on some dataset, re-tune that dataset's hyper-parameters rather than reject it.)
# embedding_size is 64 for G1/G2 and 32 for G3 (goal definition, not a structural choice).

# Launch guard: a run is deferred (queue entry stays ready) unless some GPU has at least this much free memory.
# yelp runs take 21-24 GB, movie ~12 GB, book ~5 GB (2026-11-02; external jobs hold ~42 GB per GPU).
gpu_min_free_mib: {default: 9000, amazon_movie: 16000, yelp: 36000}   # observed per-process peaks 2026-11-04: movie 15 GB, yelp 21-35 GB
launchable_models: [persona_mosaic]   # baselines (mosaic, promax, ...) only with `--allow baseline` for a reference run; never modified
# Goals (user, 2026-11-02): the MEAN relative gain over the four goal metrics (R@5, R@10, N@5, N@10) against the
# target must be at least goal_margin.  G1 and G2 are judged on PERSONA-MOSAIC at d=64 (the default until G3);
# G3 on PERSONA-MOSAIC at d=32.
goal_margin: 0.04
default_embedding_size: 64
goals:
  G1: {references: [MOSAIC, ProMax d=32], candidate_embedding_size: 64, note: "strongest baseline per metric, +4%"}
  G2: {references: [ProMax d=64], candidate_embedding_size: 64, note: "ProMax at d=64, +4%"}
  G3: {references: [ProMax d=32], candidate_embedding_size: 32, note: "PERSONA-MOSAIC at d=32 vs ProMax d=32, +4%"}
delta_reference: MOSAIC                    # the "dN@10%" column of `run.py report`
noise_floor_default: {recall: 0.003, ndcg: 0.002}   # GPU nondeterminism at the fixed seed (Book repeats, 2026-10-29/30)

control_keys: [persona_shuffle, item_shuffle, llm_prior]   # a run with any of these set is a control, never a candidate
non_candidate_overrides:   # finished runs with these values stay in the ledger as analysis but are never goal candidates
  gate_mode: [cluster]     # parameter-free gate (user, 2026-11-02: the gate must have learnable parameters)

# Never added to persona_mosaic (they are the baselines' contributions; user 2026-11-02/03). Every tier-B proposal states
# that it is not one of these (CLAUDE.md 3-2 판별 질문).
forbidden_loss_families:
  - {name: "ProMax SDR", what: "softmax of user-item text similarities over the catalog used as a soft target (cross-entropy) for the CF score distribution, any variant"}
  - {name: "ProMax S2DR", what: "InfoNCE between embeddings from the original graph and a text/RAG-augmented graph (user, item, cross), any variant"}
  - {name: "RLMRec profile KD", what: "generative or contrastive knowledge distillation from fixed profile embeddings added as a new loss"}

forbidden_override_keys:
  sdr_weight: "ProMax SDR must not exist in persona_mosaic (forbidden_loss_families)"
  s2dr_weight: "ProMax S2DR must not exist in persona_mosaic (forbidden_loss_families)"
  seed: "train.seed is fixed at 2025 by the user; multi-seed runs are not part of the protocol"
  expert_num: "K must come from the clustering rule (clustering_k_select); it is never chosen on validation or test"
  clustering_seed: "changing it changes the experts of every run; keep 2025 so all runs share the same experts"

extra_known_keys:          # override keys accepted although they are not in the model yml (none today)
  persona_mosaic: []

value_rules:
  embedding_size: {enum: [64, 32], why: "d=64 until G3 (user); d=32 only for G3 runs against ProMax d=32"}
  gate_cluster_scale: {min_exclusive: 0.0, max: 10.0, why: "scale 0 = uniform gate, ruled meaningless by the user (2026-10-31)"}
  gate_mode: {enum: [learned, residual], why: "the gate must have learnable parameters (user, 2026-11-02); cluster = parameter-free routing, analysis only"}
  gate_warmup_epochs: {min: 0, max: 60, why: "warm-up is a schedule, not a gate; the final gate must be weighted"}
  balance_loss_weight: {min: 0.0, max: 1.0}
  persona_align_weight: {min: 0.0, max_exclusive: 0.05, why: ">= 5e-2 destroys training from epoch 0 (sweep 2026-10-29)"}
  prior_injection: {enum: [modulate, additive, both]}
  prior_add_scale: {min_exclusive: 0.0, max: 5.0}
  text_score_beta_init: {min_exclusive: 0.0, max: 10.0}
  top_k: {min: 2, max: 16, why: "top_k >= 2 (user, 2026-11-04): the MoE must mix at least two experts; per-dataset hyper-parameter"}
  persona_align_side: {enum: [both, user, item]}
  persona_align_decay_epochs: {min: 0, max: 600}
  text_dim: {min: 0, max: 4096}
  persona_shuffle: {enum: [none, global, within_cluster]}
  item_text: {enum: [profile, persona, audience]}
  prior_space: {enum: [raw, pca]}
  prior_composition: {enum: [product, persona, cluster, mean, mix], why: "mix = unit(facet_k + mean) (q076, approved 2026-11-04 09:48); structural exploration until adopted into shared_structure"}
  persona_align_target: {enum: [learned, fixed]}
  clustering_k_select: {enum: [silhouette, elbow]}

protected_paths:   # tier C: the agent never edits these (baselines, shared trainer / evaluation, data)
  - models/general_cf/mosaic.py
  - models/general_cf/promax.py
  - "models/general_cf/*.py except persona_mosaic.py"
  - config/modelconf/mosaic.yml
  - config/modelconf/promax.yml
  - trainer/
  - data_utils/
  - models/loss_utils.py
  - models/base_model.py
  - models/model_utils.py
  - models/bulid_model.py
  - train_encoder.py
  - ../data/

approval_paths:    # tier B: show the diff + smoke result, run only after the user says yes
  - models/general_cf/persona_mosaic.py
  - config/modelconf/persona_mosaic.yml
