optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

# Shared by every model for a fair comparison (ProEx/ProMax papers: lr 1e-3, batch 4096, d=32, 3 layers).
train:
  epoch: 3000
  batch_size: 4096
  save_model: false
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2025
  patience: 20

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

data:
  type: general_cf
  name: yelp

model:
  name: promax
  type: discriminative
  keep_rate: 1.0
  embedding_size: 32

  # ProRec lightgcn_promax.yml (yelp)
  yelp:
    layer_num: 3
    reg_weight: 1.0e-6
    sdr_weight: 0.5
    s2dr_weight: 0.1
  # ProRec lightgcn_promax.yml: amazon (also used for amazon_movie)
  amazon_book:
    layer_num: 3
    reg_weight: 1.0e-6
    sdr_weight: 1.5
    s2dr_weight: 0.05
  amazon_movie:
    layer_num: 3
    reg_weight: 1.0e-6
    sdr_weight: 1.5
    s2dr_weight: 0.05
  yelp_s50:   # 50% of the training interactions (sparsity study), same hyper-parameters as yelp
    layer_num: 3
    reg_weight: 1.0e-6
    sdr_weight: 0.5
    s2dr_weight: 0.1
  amazon_book_h50:   # 50% of the users and items (pilot), same hyper-parameters as amazon_book
    layer_num: 3
    reg_weight: 1.0e-6
    sdr_weight: 1.5
    s2dr_weight: 0.05
