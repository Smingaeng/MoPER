optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

train:
  epoch: 3000
  batch_size: 4096
  save_model: false
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2025
  patience: 30                   # evaluations (one every test_step epochs) without a new best before early stopping
  early_stop_metric: goal_mean   # goal_mean: validation mean of recall@5, recall@10, ndcg@5, ndcg@10 | recall_last: recall@20

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

data:
  type: general_cf
  name: yelp

model:
  name: moper
  type: discriminative
  embedding_size: 32
  keep_rate: 1.0                       # edge keep rate of the expert propagation during training (1.0: no edge dropout)

  # ---- Phase 1: user personas -> experts (kind-aware two-stage k-means; no validation data) ----
  persona_file: persona_emb_v22.pkl    # data/<dataset>/persona/: {record_ids 'u<uid>:p<j>', field_mean [records, dim]}
  clustering_kind_split: 2             # stage 1: k-means split of the persona pool into this many persona kinds
  clustering_k_min: 2                  # stage 2: K inside every kind = silhouette maximum over [k_min, k_max]
  clustering_k_max: 16
  clustering_seed: 2025                # independent of train.seed, so every training seed shares the same experts
  clustering_n_init: 4                 # k-means++ restarts per K, lowest inertia kept
  clustering_max_iter: 300
  clustering_silhouette_sample: 10000  # personas sampled for the silhouette score
  clustering_device: auto              # auto: run device (GPU, fast) | cpu: bit-exact reproducible clustering | cuda

  # ---- Phase 2: mixture of persona-modulated LightGCN experts ----
  top_k: 2                             # experts kept per node by the gate
  gate_hidden_size: 128
  layer_modulation_scale: 1.0          # upper bound of lambda_l in the layer gate 1 + lambda_l * tanh(LN(MLP_l(prior)))
  layer_modulation_lambda_init: 1.0e-2
  layer_modulation_init_std: 1.0e-3

  # ---- loss: BPR + reg + balance + persona alignment + graph contrast ----
  llm_align_temperature: 0.2           # InfoNCE temperature of the persona alignment
  graph_cl_weight: 0.2                 # text-free contrast between two noisy views of the same propagation (SimGCL-type)
  graph_cl_eps: 0.1                    # noise magnitude of the views
  graph_cl_temperature: 0.2

  # ---- per-dataset hyper-parameters ----
  # reg_weight: L2 regularisation | balance_loss_weight: K * sum_k importance_k * load_k of the gate
  # persona_align_weight: gate-weighted InfoNCE between the routed output and the selected experts' priors
  # content_score_weight: b of the fixed content score at prediction (Phase 3), y = s + b * std(s_u.) * z(c_u.)
  amazon_book:
    layer_num: 3
    reg_weight: 1.0e-5
    balance_loss_weight: 1.0e-3
    persona_align_weight: 5.0e-4
    content_score_weight: 0.4

  yelp:
    layer_num: 2
    reg_weight: 2.0e-5
    balance_loss_weight: 5.0e-4
    persona_align_weight: 2.5e-3
    content_score_weight: 0.25
    layer_modulation_lambda_init: 5.0e-2
    layer_modulation_init_std: 1.0e-2

  amazon_movie:
    layer_num: 3
    reg_weight: 1.0e-5
    balance_loss_weight: 0.0
    persona_align_weight: 5.0e-3
    content_score_weight: 0.5
