optimizer:
  name: adam
  lr: 1.0e-3
  weight_decay: 0

# Shared by every model for a fair comparison (ProEx/ProMax papers: lr 1e-3, batch 4096, d=32, 3 layers).
train:
  epoch: 3000
  batch_size: 4096
  save_model: false
  loss: pairwise
  test_step: 3
  reproducible: true
  seed: 2025
  patience: 20

test:
  metrics: [recall, ndcg]
  k: [5, 10, 20]
  batch_size: 1024

data:
  type: general_cf
  name: yelp

# DisCoRec (CoMoE encoder/config/modelconf/discorec.yml); per-dataset model hyper-parameters unchanged.
# Needs usr/itm_emb_np.pkl, user/item_intent_emb_3.pkl, user/item_conf_emb.pkl in data/<dataset>/.
model:
  name: discorec
  type: discriminative
  keep_rate: 1.0
  embedding_size: 32
  intent_num: 128
  conformity_num: 64

  yelp:
    layer_num: 3
    reg_weight: 1.7e-6
    kd_weight: 3.6e-3
    kd_temperature: 0.2
    kd_int_weight: 8.0e-3
    kd_int_temperature: 0.5
    kd_int_weight_2: 2.0e-7
    kd_int_weight_3: 1.0e-7
    kd_conf_weight: 1.0e-2
    kd_conf_temperature: 0.5
    kd_conf_weight_3: 1.0e-7
    hcl_weight: 2.0e-2
    hcl_temperature: 0.2
  amazon_book:
    layer_num: 3
    reg_weight: 1.0e-6
    kd_weight: 1.0e-2
    kd_temperature: 0.2
    kd_int_weight: 2.1e-2
    kd_int_temperature: 0.5
    kd_int_weight_2: 1.0e-7
    kd_int_weight_3: 1.0e-7
    kd_conf_weight: 1.0e-2
    kd_conf_temperature: 0.5
    kd_conf_weight_3: 1.0e-7
    hcl_weight: 2.0e-2
    hcl_temperature: 0.2
  amazon_movie:
    layer_num: 3
    reg_weight: 1.0e-6
    kd_weight: 1.0e-3
    kd_temperature: 0.2
    kd_int_weight: 1.0e-1
    kd_int_temperature: 0.7
    kd_int_weight_2: 1.0e-7
    kd_int_weight_3: 1.0e-7
    kd_conf_weight: 2.0e-2
    kd_conf_temperature: 0.5
    kd_conf_weight_3: 1.0e-7
    hcl_weight: 1.0e-3
    hcl_temperature: 0.2
